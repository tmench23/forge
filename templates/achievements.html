{% extends "base.html" %}
{% block title %}Achievements{% endblock %}

{% block content %}
<div class="achievements-page">
    <div class="page-header">
        <h1>Achievements</h1>
        <p class="page-description">Unlock badges and milestones as you progress on your fitness journey</p>
    </div>

    <!-- Achievement Summary -->
    <div class="achievement-summary" id="achievementSummary">
        <div class="achievement-progress-ring">
            <svg viewBox="0 0 120 120" class="ring-svg">
                <circle cx="60" cy="60" r="52" class="ring-bg"/>
                <circle cx="60" cy="60" r="52" class="ring-fill" id="achievementRing"/>
            </svg>
            <div class="ring-text">
                <span class="ring-value" id="unlockedCount">0</span>
                <span class="ring-label">of <span id="totalCount">0</span></span>
            </div>
        </div>
        <div class="achievement-summary-text">
            <h2>Keep Going!</h2>
            <p id="achievementMessage">Start working out to unlock your first achievement</p>
        </div>
    </div>

    <!-- Achievement Grid -->
    <div class="achievement-grid" id="achievementGrid">
        <!-- Populated by JS -->
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/achievements.js') }}"></script>
{% endblock %}
